name: Générer l'APK Android CAIU

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: caiu-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Installer les composants Android nécessaires
        shell: bash
        run: |
          set -Eeuo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assembler le projet Android et la boutique
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p work/android work/site

          ANDROID_ZIP="$(find . -maxdepth 3 -type f -name 'CAIU-SENEGAL-OFFICIEL_Projet_Android(1)-1.zip' -print -quit)"
          SITE_ZIP="$(find . -maxdepth 3 -type f -name 'CAIU_boutique_avec_vos_photos.zip' -print -quit)"

          if [[ -z "$ANDROID_ZIP" ]]; then
            echo "::error::Archive Android introuvable : CAIU-SENEGAL-OFFICIEL_Projet_Android(1)-1.zip"
            exit 1
          fi
          if [[ -z "$SITE_ZIP" ]]; then
            echo "::error::Archive boutique introuvable : CAIU_boutique_avec_vos_photos.zip"
            exit 1
          fi

          unzip -q "$ANDROID_ZIP" -d work/android
          unzip -q "$SITE_ZIP" -d work/site

          PROJECT_DIR=""
          while IFS= read -r candidate; do
            PROJECT_DIR="$(dirname "$candidate")"
            break
          done < <(find work/android -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print)

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "::error::Aucun settings.gradle ou settings.gradle.kts trouvé dans l'archive Android."
            exit 1
          fi

          APP_DIR="$PROJECT_DIR/app"
          if [[ ! -d "$APP_DIR" ]]; then
            echo "::error::Module Android app introuvable dans $PROJECT_DIR."
            exit 1
          fi

          APP_BUILD_FILE=""
          for candidate in "$APP_DIR/build.gradle" "$APP_DIR/build.gradle.kts"; do
            if [[ -f "$candidate" ]]; then
              APP_BUILD_FILE="$candidate"
              break
            fi
          done
          if [[ -z "$APP_BUILD_FILE" ]]; then
            echo "::error::Fichier build.gradle ou build.gradle.kts introuvable dans $APP_DIR."
            exit 1
          fi

          APP_DIR="$APP_DIR/src/main"
          SITE_INDEX="$(find work/site -type f -path '*/CAIU_site/index.html' -print -quit)"
          if [[ -z "$SITE_INDEX" ]]; then
            echo "::error::index.html introuvable dans le dossier CAIU_site de l'archive boutique."
            exit 1
          fi
          SITE_DIR="$(dirname "$SITE_INDEX")"

          mkdir -p "$APP_DIR/assets/images" "$APP_DIR/java/sn/caiu/senegalofficiel"
          cp "$SITE_INDEX" "$APP_DIR/assets/index.html"
          if [[ -d "$SITE_DIR/images" ]]; then
            cp -R "$SITE_DIR/images/." "$APP_DIR/assets/images/"
          else
            echo "::warning::Dossier images absent : le site sera copié sans images."
          fi

          cat > "$APP_DIR/java/sn/caiu/senegalofficiel/MainActivity.kt" <<'KOTLIN'
          package sn.caiu.senegalofficiel

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.webkit.WebResourceRequest
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient

          class MainActivity : Activity() {
              private lateinit var webView: WebView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  webView = WebView(this)
                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      allowFileAccess = true
                      allowContentAccess = false
                      allowFileAccessFromFileURLs = false
                      allowUniversalAccessFromFileURLs = false
                      mixedContentMode = WebSettings.MIXED_CONTENT_NEVER_ALLOW
                      setSupportMultipleWindows(false)
                  }
                  webView.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(view: WebView, request: WebResourceRequest): Boolean =
                          handleNavigation(request.url)

                      @Suppress("DEPRECATION")
                      override fun shouldOverrideUrlLoading(view: WebView, url: String): Boolean =
                          handleNavigation(Uri.parse(url))
                  }
                  WebView.setWebContentsDebuggingEnabled(false)
                  setContentView(webView)
                  webView.loadUrl("file:///android_asset/index.html")
              }

              private fun handleNavigation(uri: Uri): Boolean {
                  if (uri.scheme == "file" && uri.path?.startsWith("/android_asset/") == true) return false
                  if (uri.scheme == "https" && uri.host == "wa.me" && uri.path == "/221771908785") {
                      return try {
                          startActivity(Intent(Intent.ACTION_VIEW, uri))
                          true
                      } catch (_: Exception) {
                          true
                      }
                  }
                  return true
              }

              override fun onDestroy() {
                  if (::webView.isInitialized) {
                      webView.stopLoading()
                      webView.destroy()
                  }
                  super.onDestroy()
              }
          }
          KOTLIN

          cat > "$APP_DIR/AndroidManifest.xml" <<'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:theme="@style/AppTheme"
                  android:label="CAIU BOUTIQUE"
                  android:usesCleartextTraffic="false"
                  android:allowBackup="false"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST

          echo "Projet Android : $PROJECT_DIR"
          echo "Fichier Gradle : $APP_BUILD_FILE"
          echo "Nombre d'images copiées : $(find "$APP_DIR/assets/images" -type f | wc -l)"

      - name: Compiler l'APK de test
        shell: bash
        run: |
          set -Eeuo pipefail
          PROJECT_DIR="$(find work/android -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)"
          if [[ -z "$PROJECT_DIR" ]]; then
            echo "::error::Projet Android introuvable après assemblage."
            exit 1
          fi
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Vérifier et préparer l'APK
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          APK_SOURCE="$(find "$GITHUB_WORKSPACE/work/android" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          if [[ -z "$APK_SOURCE" || ! -s "$APK_SOURCE" ]]; then
            echo "::error::Aucun APK debug valide n'a été produit."
            exit 1
          fi
          cp "$APK_SOURCE" "$GITHUB_WORKSPACE/apk-output/CAIU-BOUTIQUE-debug.apk"
          test -s "$GITHUB_WORKSPACE/apk-output/CAIU-BOUTIQUE-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/apk-output/CAIU-BOUTIQUE-debug.apk"

      - name: Publier l'APK en artefact
        uses: actions/upload-artifact@v4
        with:
          name: CAIU-BOUTIQUE-debug-APK
          path: apk-output/CAIU-BOUTIQUE-debug.apk
          if-no-files-found: error
          retention-days: 14
