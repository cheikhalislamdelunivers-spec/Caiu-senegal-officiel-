
name: Build CAIU Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
       
      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
 

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir source
          ZIP_FILE=$(find . -maxdepth 1 -name 'CAIU-SENEGAL-OFFICIEL_Projet_Android*.zip' | head -n 1)
          test -n "$ZIP_FILE"
          unzip -q "$ZIP_FILE" -d source

      - name: Build APK
        working-directory: source/CAIU-SENEGAL-OFFICIEL-Android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CAIU-SENEGAL-OFFICIEL-APK
          path: source/CAIU-SENEGAL-OFFICIEL-Android/app/build/outputs/apk/debug/app-debug.apk
