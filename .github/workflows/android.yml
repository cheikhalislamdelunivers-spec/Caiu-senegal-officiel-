name: Générer l'APK Android CAIU

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer les composants Android
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraire le projet Android CAIU
        run: |
          set -euo pipefail
          ZIP_FILE="CAIU-SENEGAL-OFFICIEL_Projet_Android(1)-1.zip"
          test -f "$ZIP_FILE" || { echo "ZIP Android introuvable"; exit 1; }
          mkdir -p caiu-android
          unzip -q "$ZIP_FILE" -d caiu-android

      - name: Compiler l'application
        run: |
          set -euo pipefail
          SETTINGS=$(find caiu-android -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          test -n "$SETTINGS" || { echo "Fichier settings.gradle introuvable"; exit 1; }
          PROJECT_DIR=$(dirname "$SETTINGS")
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Préparer l'APK
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          find "$GITHUB_WORKSPACE/caiu-android" -type f -path '*/build/outputs/apk/*' -name '*.apk' -exec cp {} "$GITHUB_WORKSPACE/apk-output/" \;
          ls -lh "$GITHUB_WORKSPACE/apk-output"
          compgen -G "$GITHUB_WORKSPACE/apk-output/*.apk" >/dev/null

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: CAIU-ANDROID-APK
          path: apk-output/*.apk
          if-no-files-found: error
