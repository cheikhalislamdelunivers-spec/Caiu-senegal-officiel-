name: Générer l'APK Android CAIU

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurer Android SDK sans ancien paquet tools
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$SDKMANAGER" || { echo "sdkmanager introuvable"; exit 1; }
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraire le projet Android CAIU
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="CAIU-SENEGAL-OFFICIEL_Projet_Android(1)-1.zip"
          test -f "$ZIP_FILE" || { echo "ZIP Android introuvable"; exit 1; }
          mkdir -p caiu-android
          unzip -q "$ZIP_FILE" -d caiu-android

      - name: Aligner Java et Kotlin sur Java 17
        shell: bash
        run: |
          set -euo pipefail
          APP_GRADLE=$(find caiu-android -type f -path '*/app/build.gradle' -print -quit)
          test -n "$APP_GRADLE" || { echo "app/build.gradle introuvable"; exit 1; }
          cat >> "$APP_GRADLE" <<'GRADLE'
          
          // CAIU CI: aligner la compilation Java sur Kotlin/JVM 17
          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          GRADLE
          echo "Compatibilité Java/Kotlin configurée sur Java 17"

      - name: Compiler l'application
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS=$(find caiu-android -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          test -n "$SETTINGS" || { echo "Fichier settings.gradle introuvable"; exit 1; }
          PROJECT_DIR=$(dirname "$SETTINGS")
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Préparer l'APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          find "$GITHUB_WORKSPACE/caiu-android" -type f -path '*/build/outputs/apk/*' -name '*.apk' -exec cp {} "$GITHUB_WORKSPACE/apk-output/" \;
          ls -lh "$GITHUB_WORKSPACE/apk-output"
          compgen -G "$GITHUB_WORKSPACE/apk-output/*.apk" >/dev/null

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: CAIU-ANDROID-APK
          path: apk-output/*.apk
          if-no-files-found: error
